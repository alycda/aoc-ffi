[package]
name = "aoc-2024-12-01"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "aoc_ffi_day01"

[build-dependencies]
cc = "1"
uniffi = { version = "0.28", features = ["build"] }

[dependencies]
ahash = "0.8"
glib-sys = { version = "0.20", optional = true }
uniffi = "0.28.3"
thiserror = "1.0"

[features]
default = ["glib"]
glib = ["glib-sys"]

[dev-dependencies]
criterion = "0.5"
rstest = "0.26"

[[bench]]
name = "aoc_bench"
harness = false
